name: Deploy stats-prototype to GitHub Pages

on:
  push:
    branches:
      - claude/boss-app-stats-prototype-8syxnr
    paths:
      - "stats-prototype/**"
      - ".github/workflows/deploy-stats-prototype.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: stats-prototype/package-lock.json

      - name: Install dependencies
        working-directory: stats-prototype
        run: npm ci

      - name: Build
        working-directory: stats-prototype
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: stats-prototype/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
